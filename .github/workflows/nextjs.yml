# Workflow for deploying NoxTitan to GitHub Pages
name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      
      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      
      - name: Create deployment directory
        run: |
          mkdir -p _site
          
          # Copy the demo files (these work as static HTML)
          cp index.html _site/
          [ -f demo-interactive.html ] && cp demo-interactive.html _site/
          [ -f demo-noxtitan-final.html ] && cp demo-noxtitan-final.html _site/
          [ -f demo-self-contained.html ] && cp demo-self-contained.html _site/
          [ -f demo-music.mp3 ] && cp demo-music.mp3 _site/
          [ -f noxtitan-logo.png ] && cp noxtitan-logo.png _site/
          
          # Create a README for GitHub Pages
          cat > _site/README.txt << 'EOF'
          NoxTitan™ - GitHub Pages Deployment
          
          ⚠️ IMPORTANT NOTE:
          This GitHub Pages deployment shows the NoxTitan demo/presentation.
          
          The full NoxTitan application is a Next.js app with server-side features
          that cannot run on GitHub Pages (which only supports static content).
          
          To deploy the full NoxTitan application with all features:
          1. Use Vercel (recommended): https://vercel.com
          2. Or Netlify: https://netlify.com
          3. Or any platform with Node.js 20+ support
          
          The full app includes:
          - Employee scheduling & management
          - Time clock & attendance
          - HR automation
          - Payroll calculations
          - Analytics & reporting
          - And 30+ other features
          
          For questions: hello@noxtitan.com
          EOF
          
          # Add .nojekyll to prevent GitHub Pages from ignoring underscore files
          touch _site/.nojekyll
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
